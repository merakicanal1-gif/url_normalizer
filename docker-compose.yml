version: '3.8'

services:
  url-normalizer:
    build: .
    # O container_name pode ser omitido em deploys de produção (ex: Swarm/EasyPanel)
    # para permitir escalabilidade horizontal automática.
    container_name: url_normalizer_api
    ports:
      # No EasyPanel / Traefik, a publicação de portas é gerenciada pelo proxy reverso.
      # Para uso local, mantemos exposto na porta 3000.
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - TIMEOUT_MS=30000
      - SESSION_STORAGE_DIR=/app/data/profiles
      - INTERACTIVE_BROWSER_ENABLED=false
      # A chave de criptografia DEVE ser passada via variável de ambiente externa.
      # NÃO defina chaves de produção neste arquivo.
      - SESSION_ENCRYPTION_KEY=${SESSION_ENCRYPTION_KEY}
    volumes:
      # Volume persistente nomeado para salvar os perfis
      - url_normalizer_data:/app/data
    healthcheck:
      # Usa curl presente na imagem base Playwright Noble para testar se a API está pronta
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  url_normalizer_data:
    driver: local
